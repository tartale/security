# Example inventory. Copy to inventory.yaml (gitignored) and fill in real references.
# Never put secret values in this file. It holds identifiers and locations only.
#
# Schema is a proposal; see docs/design.md.

credentials:
  - id: cloudflare-dns-edit
    provider: cloudflare
    mode: auto
    provider_ref:
      token_id: "<cloudflare token id>"
    store:
      type: bitwarden
      item: "Cloudflare DNS token"
    destinations:
      - type: envfile
        path: "~/projects/example/.envrc"
        var: CLOUDFLARE_API_TOKEN
    rotate_every_days: 90

  - id: jira-dc-personal
    provider: jira-data-center
    mode: auto
    provider_ref:
      base_url: "https://jira.example.com"
      token_name: "rotator"
    store:
      type: bitwarden
      item: "Jira DC PAT"
    destinations:
      - type: envfile
        path: "~/projects/example/.env"
        var: JIRA_PAT
    rotate_every_days: 60

  - id: github-fine-grained-ci
    provider: github
    kind: fine-grained
    mode: assisted
    provider_ref:
      host: "github.com"
    store:
      type: bitwarden
      item: "GitHub fine-grained PAT (ci)"
    destinations:
      - type: envfile
        path: "~/projects/example/.envrc"
        var: GITHUB_TOKEN
    rotate_every_days: 30
    notes: "Also set in CI secrets manually."

  - id: runpod-main
    provider: runpod
    mode: assisted
    store:
      type: bitwarden
      item: "RunPod API key"
    destinations:
      - type: envfile
        path: "~/projects/example/.env"
        var: RUNPOD_API_KEY
    rotate_every_days: 90
