# Example config documenting the schema. The real file is credentials/credentials.yaml
# (gitignored); `./security credentials --init` builds it interactively.
# Never put secret values in this file. It holds identifiers and locations only.
#
# Schema is a proposal; see docs/design.md.

# Optional. A credential whose `provider` names one of these ids takes its type from `type`
# and its `provider_ref` from `settings`, with the credential's own provider_ref on top.
providers:
  - id: jira-main
    type: jira-data-center
    settings:
      base_url: "https://jira.example.com"
      # current_token_env: JIRA_ROTATOR_TOKEN

credentials:
  - id: cloudflare-dns-edit
    provider: cloudflare
    mode: auto
    provider_ref:
      token_id: "<cloudflare token id>"
      # account_id: "<account id>"   # set for account-owned tokens
      # manager_token_env: CLOUDFLARE_ROTATOR_TOKEN   # env var holding the token that rolls this one
    store:
      type: bitwarden
      item: "Cloudflare DNS token"
    destinations:
      - type: envfile
        path: "~/projects/example/.envrc"
        var: CLOUDFLARE_API_TOKEN
    rotate_every_days: 90
    # last_rotated: 2026-09-01   # seeds `rotator due`; the audit log supersedes it

  - id: jira-dc-personal
    provider: jira-main
    mode: auto
    provider_ref:
      token_name: "rotator"
      # expiration_days: 90   # default: rotate_every_days + grace_days + 14
      # current_token_env: JIRA_ROTATOR_TOKEN   # env var holding the existing PAT
    store:
      type: bitwarden
      item: "Jira DC PAT"
    destinations:
      - type: envfile
        path: "~/projects/example/.env"
        var: JIRA_PAT
    rotate_every_days: 60

  - id: github-fine-grained-ci
    provider: github
    kind: fine-grained
    mode: assisted
    provider_ref:
      host: "github.com"
    store:
      type: bitwarden
      item: "GitHub fine-grained PAT (ci)"
    destinations:
      - type: envfile
        path: "~/projects/example/.envrc"
        var: GITHUB_TOKEN
    rotate_every_days: 30
    notes: "Also set in CI secrets manually."

  - id: runpod-main
    provider: runpod
    mode: assisted
    store:
      type: bitwarden
      item: "RunPod API key"
    destinations:
      - type: envfile
        path: "~/projects/example/.env"
        var: RUNPOD_API_KEY
    rotate_every_days: 90
