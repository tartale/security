[project]
name = "rotator"
version = "0.1.0"
description = "Rotate API keys and tokens and distribute them to Bitwarden and env files."
requires-python = ">=3.11"
dependencies = ["typer>=0,<1", "pyyaml>=6,<7", "httpx>=0,<1"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "respx>=0,<1", "ruff>=0,<1"]

[project.scripts]
rotator = "rotator.cli:app"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
